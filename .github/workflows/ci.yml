name: Build and publish Skill

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Test Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check version consistency
        run: npm run version:check -- --source
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/version.mjs --check --source --tag "$RELEASE_TAG"
        shell: bash
      - run: npm run build
        env:
          MAILCAL_BUILD_SOURCE: ${{ github.sha }}
      - run: npm run version:check
      - run: npm test
      - name: Check Skill discovery
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        env:
          DISABLE_TELEMETRY: '1'
        run: npx --yes skills add . --list

  publish:
    name: Publish tagged Skill
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/version.mjs --check --source --tag "$RELEASE_TAG"
      - run: npm run build
        env:
          MAILCAL_BUILD_SOURCE: ${{ github.sha }}
      - run: npm run version:check
      - run: npm run test:bundle
      - name: Update installable files on main
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo "main has moved beyond this tag; publish its archive without changing main."
            exit 0
          fi
          git add -- skills/mail-calendar/SKILL.md skills/mail-calendar/scripts/mailcal.mjs
          if git diff --cached --quiet; then
            echo "Installable files already match this release build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish ${RELEASE_TAG} skill"
          git push origin HEAD:refs/heads/main
      - name: Publish Skill archive and checksum
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset="mail-calendar-${RELEASE_TAG}.tar.gz"
          tar -czf "$asset" -C skills mail-calendar
          sha256sum "$asset" > "$asset.sha256"
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$asset" "$asset.sha256" \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${options[@]}"
